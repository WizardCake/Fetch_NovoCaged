[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdet-fetch"
version = "0.1.0"
description = "Scraper e pipeline para microdados RAIS e Novo CAGED do FTP público do MTE."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[project.scripts]
novo-caged = "pdet.caged.cli:main"
rais = "pdet.rais.cli:main"
integra-rais-caged = "pdet.integra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
